# Tool settings only: the dash runs from the checkout (python -m digifiz.app)
# and is not packaged.

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["tools/diagrams/node_modules"]

[tool.ruff.lint]
# Ruff's defaults (real errors) plus sorted imports.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
