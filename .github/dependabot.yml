# Weekly dependency updates, one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      python:
        patterns: ["*"]

  # The diagram exporter's npm packages; only used to render docs/diagrams.
  - package-ecosystem: npm
    directory: /tools/diagrams
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      diagrams:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
